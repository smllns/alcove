<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- "a." on paper; the SVG follows the system theme, the PNGs are for
         browsers without SVG icons and for the iOS home screen -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Installable, on a phone's home screen or a computer's dock, as an
         app of its own (public/manifest.webmanifest) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="alcove" />
    <!-- The browser's or the phone's bars in the page's paper; set to the
         theme's own below and by ThemeProvider -->
    <meta name="theme-color" content="#f3e6cc" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>alcove</title>
    <!-- Pick the theme before first paint so there's no flash of the wrong one -->
    <script>
      try {
        var theme = localStorage.getItem('alcove-theme');
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light';
        }
        document.documentElement.dataset.theme = theme;
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', theme === 'dark' ? '#221e1b' : '#f3e6cc');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
