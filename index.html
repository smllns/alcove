<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- "a." on paper; the SVG follows the system theme, the PNGs are for
         browsers without SVG icons and for the iOS home screen -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>alcove</title>
    <!-- Pick the theme before first paint so there's no flash of the wrong one -->
    <script>
      try {
        var theme = localStorage.getItem('alcove-theme');
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light';
        }
        document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
